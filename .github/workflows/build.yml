name: Test building package

# Build the project whenever the configuration is changed.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'       # check markdown is valid
      - 'MANIFEST.in'     # check packaging
      - 'pyproject.toml'  # check build config
      - '.gitignore'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  test-build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
        python: ['3.12', '3.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      FORCE_COLOR: 1
      PIP_PROGRESS_BAR: off
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: mamba-org/setup-micromamba@v3
        with:
          cache-environment: true
          environment-name: cylc-build
          create-args: >-
            python=${{ matrix.python }}
            pip

      - name: Build package
        uses: Fraetor/release-actions/build-python-package@ci_improvements

      - name: Ensure package contains expected files
        run: |
          unzip -l dist/*.whl | tee files
          grep -E 'cylc_flow.*.dist-info/.*COPYING' files
          grep 'cylc/flow/py.typed' files
          grep 'cylc/flow/etc' files
          grep 'cylc/flow/etc/cylc-completion.bash' files
