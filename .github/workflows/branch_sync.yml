name: Create branch sync PR

on:
  push:
    branches:
      - '8.*.x'
  schedule:
    - cron: '33 04 * * 1-5' # 04:33 UTC Mon-Fri
  workflow_dispatch:
    inputs:
      head_branch:
        description: Branch containing changes to create the sync PR from.
        required: true
        type: string

permissions: {}
cache-mode: none

jobs:
  sync:
    if: github.repository_owner == 'cylc' || github.event_name != 'schedule'
    uses: Fraetor/release-actions/.github/workflows/branch-sync.yml@ci_improvements
    with:
      head_branch: ${{ inputs.head_branch }}
    permissions:
      contents: write
      pull-requests: write
