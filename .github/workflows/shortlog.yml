name: Check contributor list

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/shortlog.yml'
      - 'CONTRIBUTING.md'
      - '.mailmap'
  schedule:
    - cron: '37 06 * * 1' # 06:37, Monday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-shortlog:
    uses: Fraetor/release-actions/.github/workflows/check-shortlog.yml@ci_improvements
    permissions:
      contents: read
