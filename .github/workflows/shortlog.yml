name: Check contributor list

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'CONTRIBUTING.md'
      - '.github/workflows/shortlog.yml'
      - '.mailmap'
  schedule:
    - cron: '37 06 * * 1' # 06:37, Monday

permissions: {}

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need to fetch all commits to check contributors.
          persist-credentials: false

      - name: Check CONTRIBUTING.md
        uses: Fraetor/release-actions/check-shortlog@ci_improvements
